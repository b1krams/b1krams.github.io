<head>

<meta charset="utf-8"/>

<!-- Mind Elixir v5+ CSS -->
<link href="https://cdn.jsdelivr.net/npm/mind-elixir/dist/style.css" rel="stylesheet"/>

<style>
    /* Styling resets to keep page dark background */
    html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
    }
    
    /* Toast styles */
    #toast.show {
        opacity: 1;
        transform: translateY(0);
    }
    
    /* Drop overlay */
    #drop-overlay.active {
        display: flex !important;
    }

<style type="text/tailwindcss">

        --font-sans: "Inter", sans-serif;
    }
</style>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans relative overflow-hidden">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe height="0" src="https://www.googletagmanager.com/ns.html?id=GTM-P6F464KX" style="display:none;visibility:hidden" width="0"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header class="border-b border-zinc-900 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50 w-full">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex-1 flex items-center gap-4">
        <a class="flex items-center gap-2 font-bold text-white text-lg" href="/">
          <img class="h-8 w-auto" src="/logo.svg" alt="Logo">
          <span>Swiss<span class="text-cyan-500">Web</span></span>
        </a>
        <div class="border-l border-slate-700 pl-4 ml-4">
          <h1 class="text-sm font-semibold text-slate-300">Mind Map</h1>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 transition" href="/">
          Home
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Floating Controls Panel -->
<div id="controls-panel" class="fixed top-20 left-4 z-45 max-w-xs w-full bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-2xl backdrop-blur-md transition-all duration-300 transform" style="transition-property: transform, opacity;">
    <div class="flex items-center gap-2 mb-4 border-b border-slate-850 pb-3">
        <span class="text-lg">🧠</span>
        <span class="text-sm font-bold text-zinc-100">Controls Panel</span>
    </div>
    
    <ul class="space-y-3 text-xs text-zinc-400 mb-5">
        <li class="flex items-center gap-2">
            <span>➕</span>
            <span>Click <kbd class="bg-slate-800 text-slate-200 px-1 py-0.5 rounded">+</kbd> to add child</span>
        </li>
        <li class="flex items-center gap-2">
            <span>⌨️</span>
            <span><kbd class="bg-slate-800 text-slate-200 px-1 py-0.5 rounded">Enter</kbd> — Add sibling</span>
        </li>
        <li class="flex items-center gap-2">
            <span>⌨️</span>
            <span><kbd class="bg-slate-800 text-slate-200 px-1 py-0.5 rounded">Tab</kbd> — Add child</span>
        </li>
        <li class="flex items-center gap-2">
            <span>🖱️</span>
            <span>Drag nodes or canvas to pan</span>
        </li>
        <li class="flex items-center gap-2">
            <span>🗑️</span>
            <span><kbd class="bg-slate-800 text-slate-200 px-1 py-0.5 rounded">Del</kbd> — Remove selected</span>
        </li>
        <li class="flex items-center gap-2">
            <span>✏️</span>
            <span>Double-click to rename</span>
        </li>
    </ul>
    
    <div class="border-t border-slate-850 pt-4 space-y-4">
        <div>
            <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">File actions</span>
            <div class="grid grid-cols-2 gap-2">
                <button class="inline-flex items-center justify-center rounded-lg bg-cyan-650 px-3 py-2 text-xs font-semibold text-white hover:bg-cyan-700 transition cursor-pointer" onclick="exportFile()">
                    Export
                </button>
                <button class="inline-flex items-center justify-center rounded-lg border border-slate-800 bg-zinc-950 px-3 py-2 text-xs font-semibold text-slate-300 hover:bg-slate-900 hover:text-white transition cursor-pointer" onclick="triggerImport()">
                    Import
                </button>
            </div>
            <input accept=".json" id="file-input" onchange="importFile(event)" class="hidden" type="file"/>
        </div>
        
        <div class="border-t border-slate-850 pt-4">
            <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Danger zone</span>
            <button class="w-full inline-flex items-center justify-center rounded-lg border border-red-900/50 bg-red-950/20 px-3 py-2 text-xs font-semibold text-red-400 hover:bg-red-900/25 transition cursor-pointer" onclick="resetMap()">
                Reset Map
            </button>
        </div>
    </div>
</div>

<!-- Panel toggle button (shown when panel is collapsed) -->
<button id="toggle-btn" onclick="togglePanel()" class="fixed top-20 left-4 z-40 w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-lg hover:bg-slate-850 cursor-pointer shadow-lg" title="Toggle controls">🧠</button>

<!-- Drag-and-drop overlay -->
<div id="drop-overlay" class="fixed inset-0 bg-zinc-950/90 backdrop-blur-md z-50 hidden flex-col items-center justify-center text-center p-8 border-4 border-dashed border-cyan-500 m-4 rounded-2xl">
    <span class="text-5xl mb-4 text-cyan-400">📂</span>
    <span class="text-lg font-bold text-slate-200">Drop your .json mind map file</span>
</div>

<!-- Mind Map Canvas -->
<div id="map" class="flex-1 w-full h-full"></div>

<!-- Toast notification component -->
<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-850 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5 opacity-0 translate-y-2 transition duration-300 pointer-events-none">
    <span class="toast-icon text-sm"></span>
    <span id="toast-msg" class="text-xs font-semibold text-slate-200"></span>
</div>

<footer class="fixed bottom-4 left-0 right-0 text-center text-[10px] text-slate-600 pointer-events-none z-10">
    Made with ❤️ by Bikram
</footer>

<!-- Mind Elixir v5+ ESM (type="module" required) -->
<script type="module">
        import MindElixir from 'https://cdn.jsdelivr.net/npm/mind-elixir/dist/MindElixir.js'

        const options = {
            el: '#map',
            direction: MindElixir.SIDE,
            draggable: true,
            contextMenu: true,
            toolBar: true,
            nodeMenu: true,
            keypress: true,
            locale: 'en',
        }

        const mind = new MindElixir(options)
        
        const CACHE_KEY = 'mind_elixir_data'

        // ── Cache Loading & Auto-Save ────────────────────────────────
        let initialData
        try {
            const cached = localStorage.getItem(CACHE_KEY)
            if (cached) initialData = JSON.parse(cached)
        } catch (e) {
            console.warn('Failed to parse cache', e)
        }

        if (!initialData) {
            initialData = MindElixir.new('✨ New Creative Idea')
        }

        // v5 API: pass data to init()
        mind.init(initialData)

        // Save on every operation
        mind.bus.addListener('operation', () => {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(mind.getData()))
            } catch (e) {
                console.warn('Failed to save to cache:', e)
            }
        })

        // ── Export as JSON file ──────────────────────────────────────
        window.exportFile = function () {
            try {
                const mapData = mind.getData()
                const json    = JSON.stringify(mapData, null, 2)
                const blob    = new Blob([json], { type: 'application/json' })
                const url     = URL.createObjectURL(blob)
                const rootTopic = mapData?.nodeData?.topic ?? 'mind-map'
                const safeName  = rootTopic.replace(/[^a-z0-9]/gi, '_').toLowerCase()
                const a         = document.createElement('a')
                a.href          = url
                a.download      = `${safeName}_${Date.now()}.json`
                a.click()
                URL.revokeObjectURL(url)
                showToast('💾', 'Mind map saved as file')
            } catch (e) {
                showToast('❌', 'Export failed — check console')
                console.error(e)
            }
        }

        // ── Trigger file picker ──────────────────────────────────────
        window.triggerImport = function () {
            document.getElementById('file-input').click()
        }

        // ── Import from JSON file ────────────────────────────────────
        window.importFile = function (event) {
            const file = event.target.files[0]
            if (!file) return
            const reader = new FileReader()
            reader.onload = function (e) {
                try {
                    const mapData = JSON.parse(e.target.result)
                    mind.init(mapData)
                    localStorage.setItem(CACHE_KEY, JSON.stringify(mapData))
                    showToast('📂', `Loaded: ${file.name}`)
                } catch (err) {
                    showToast('❌', 'Invalid file — not a valid mind map')
                    console.error(err)
                }
            }
            reader.readAsText(file)
            // Reset so the same file can be re-imported
            event.target.value = ''
        }

        // ── Drag-and-drop import ─────────────────────────────────────
        const dropOverlay = document.getElementById('drop-overlay')
        let dragCounter = 0

        document.addEventListener('dragenter', (e) => {
            if ([...e.dataTransfer.items].some(i => i.kind === 'file')) {
                dragCounter++
                dropOverlay.classList.add('active')
            }
        })
        document.addEventListener('dragleave', () => {
            dragCounter--
            if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active') }
        })
        document.addEventListener('dragover', (e) => e.preventDefault())
        document.addEventListener('drop', (e) => {
            e.preventDefault()
            dragCounter = 0
            dropOverlay.classList.remove('active')
            const file = e.dataTransfer.files[0]
            if (!file || !file.name.endsWith('.json')) {
                showToast('❌', 'Please drop a .json mind map file')
                return
            }
            const reader = new FileReader()
            reader.onload = (ev) => {
                try {
                    const mapData = JSON.parse(ev.target.result)
                    mind.init(mapData)
                    localStorage.setItem(CACHE_KEY, JSON.stringify(mapData))
                    showToast('📂', `Loaded: ${file.name}`)
                } catch (err) {
                    showToast('❌', 'Invalid file — not a valid mind map')
                    console.error(err)
                }
            }
            reader.readAsText(file)
        })

        // ── Reset ───────────────────────────────────────────────────
        window.resetMap = function () {
            if (!confirm('Reset the mind map? This will clear all nodes.')) return
            const newData = MindElixir.new('✨ New Creative Idea')
            mind.init(newData)
            localStorage.setItem(CACHE_KEY, JSON.stringify(newData))
            showToast('🔄', 'Mind map reset')
        }

        // ── Panel toggle & Auto-collapse ─────────────────────────────
        const panelEl = document.getElementById('controls-panel')
        const btnEl   = document.getElementById('toggle-btn')
        let collapseTimer = null

        function startCollapseTimer() {
            clearTimeout(collapseTimer)
            collapseTimer = setTimeout(() => {
                panelEl.classList.add('opacity-0', 'pointer-events-none', 'scale-95')
                btnEl.classList.remove('hidden')
            }, 5000)
        }

        panelEl.addEventListener('mouseenter', () => clearTimeout(collapseTimer))
        panelEl.addEventListener('mouseleave', startCollapseTimer)

        window.togglePanel = function () {
            const collapsed = panelEl.classList.contains('opacity-0')
            if (collapsed) {
                panelEl.classList.remove('opacity-0', 'pointer-events-none', 'scale-95')
                btnEl.classList.add('hidden')
                startCollapseTimer()
            } else {
                panelEl.classList.add('opacity-0', 'pointer-events-none', 'scale-95')
                btnEl.classList.remove('hidden')
                clearTimeout(collapseTimer)
            }
        }

        // Start initial countdown on load
        startCollapseTimer()

        // ── Toast helper ─────────────────────────────────────────────
        window.showToast = function (icon, msg) {
            const toast   = document.getElementById('toast')
            const iconEl  = toast.querySelector('.toast-icon')
            const msgEl   = document.getElementById('toast-msg')
            iconEl.textContent = icon
            msgEl.textContent  = msg
            toast.classList.add('show')
            setTimeout(() => toast.classList.remove('show'), 3000)
        }

        // Make mind accessible globally for debugging
        window._mind = mind
    </script>
</body>
</html>
