<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ZenTime | Pomodoro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link href="/style.css" rel="stylesheet"/>
<link href="/logo.png" rel="icon" type="image/png"/>
</head>
<body class="bg-[#0b0e14] text-slate-50 flex flex-col justify-between items-center h-[100dvh] m-0 overflow-hidden select-none">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe height="0" src="https://www.googletagmanager.com/ns.html?id=GTM-P6F464KX" style="display:none;visibility:hidden" width="0"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<nav class="global-nav">
<div class="global-nav-brand-container"><a class="global-nav-brand" href="/">
<img alt="Logo" class="global-nav-icon" src="/logo.png"/>
        Swiss<span>Web</span>
</a><div class="global-nav-divider"><h1 class="global-nav-tool-title">ZenTime</h1></div></div>
<div class="global-nav-links">
<a class="global-nav-link" href="/">Home</a>
</div>
</nav>
<div class="w-full h-full flex flex-col justify-between items-center" id="app" v-cloak="">
<!-- Header -->
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-sm px-6">
<!-- Mode Selector (Segmented Control) -->
<div class="flex justify-center gap-2 mb-8 bg-[#0b0e14]/50 p-1.5 rounded-2xl border border-slate-800 w-fit mx-auto">
<button :class="['px-6 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300', activeMode === mode.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20' : 'text-slate-400 hover:bg-slate-800']" :key="mode.id" @click="setMode(mode.id)" v-for="mode in modes">
                    {{ mode.label }}
                </button>
</div>
<!-- Timer Circle -->
<div class="relative w-[240px] h-[240px] flex items-center justify-center mb-12">
<svg class="progress-ring origin-center absolute w-full h-full" height="240" viewbox="0 0 240 240" width="240">
<!-- Background track -->
<circle class="stroke-slate-800" cx="120" cy="120" fill="transparent" r="110" stroke-width="8"></circle>
<!-- Progress track -->
<circle :stroke-dasharray="circumference + ' ' + circumference" :stroke-dashoffset="progressOffset" class="progress-ring__circle stroke-indigo-500" cx="120" cy="120" fill="transparent" r="110" stroke-width="8"></circle>
</svg>
<div class="z-10 flex flex-col items-center">
<div class="text-[4rem] font-light tracking-tight">{{ formattedTime }}</div>
<div class="text-xs font-medium text-slate-400 uppercase tracking-wider mt-1">{{ currentModeLabel }}</div>
</div>
</div>
<!-- Controls -->
<div class="flex justify-center gap-4 w-full">
<button :class="['flex-1 font-bold py-4 px-8 rounded-2xl transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-xl text-lg flex items-center justify-center gap-2', isPlaying ? 'bg-rose-500 hover:bg-rose-400 text-white shadow-rose-500/25' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/40']" @click="toggleTimer">
<svg class="lucide lucide-pause" fill="currentColor" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" v-if="isPlaying" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><rect height="16" width="4" x="6" y="4"></rect><rect height="16" width="4" x="14" y="4"></rect></svg>
<svg class="lucide lucide-play" fill="currentColor" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" v-else="" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
<span>{{ isPlaying ? 'Pause' : (timeLeft === totalTime ? 'Start' : 'Resume') }}</span>
</button>
<button @click="resetTimer" aria-label="Reset" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 px-8 rounded-2xl transition-all border border-slate-700 text-lg">
                    Reset
                </button>
</div>
</main>
<!-- Footer -->
<footer class="w-full pb-8 text-center pt-2 flex flex-col items-center gap-2">
<button :class="['text-[0.65rem] transition-opacity uppercase tracking-widest bg-transparent border-none cursor-pointer p-2', notificationEnabled ? 'opacity-100 text-sky-400' : 'opacity-40 hover:opacity-100 text-slate-50']" @click="requestNotification">
                {{ notificationStatus }}
            </button>
<p class="text-[0.65rem] opacity-50 tracking-wider m-0">Made with ❤️ by Bikram</p>
</footer>
</div>
<script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const modes = [
                    { id: 'pomo', label: 'Pomodoro', time: 25 },
                    { id: 'short', label: 'Short Break', time: 5 },
                    { id: 'long', label: 'Long Break', time: 15 }
                ];

                const activeMode = ref('pomo');
                const totalTime = ref(25 * 60);
                const timeLeft = ref(25 * 60);
                const isPlaying = ref(false);
                const notificationStatus = ref('Enable Notifications');
                const notificationEnabled = ref(false);

                let timerId = null;
                const radius = 110;
                const circumference = radius * 2 * Math.PI;

                const currentModeLabel = computed(() => {
                    if (activeMode.value === 'pomo') return 'Focus';
                    if (activeMode.value === 'short') return 'Short Break';
                    return 'Long Break';
                });

                const formattedTime = computed(() => {
                    const mins = Math.floor(timeLeft.value / 60);
                    const secs = timeLeft.value % 60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                });

                const progressOffset = computed(() => {
                    const percent = totalTime.value === 0 ? 0 : ((totalTime.value - timeLeft.value) / totalTime.value) * 100;
                    return circumference - (100 - percent) / 100 * circumference;
                });

                const setMode = (modeId) => {
                    activeMode.value = modeId;
                    const mode = modes.find(m => m.id === modeId);
                    totalTime.value = mode.time * 60;
                    timeLeft.value = totalTime.value;
                    if (timerId) {
                        clearInterval(timerId);
                        timerId = null;
                    }
                    isPlaying.value = false;
                };

                const requestNotification = () => {
                    if (!("Notification" in window)) return;
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            notificationEnabled.value = true;
                            notificationStatus.value = 'Notifications Enabled';
                        } else {
                            notificationEnabled.value = false;
                            notificationStatus.value = 'Notifications Denied';
                        }
                    });
                };

                const notify = () => {
                    if (Notification.permission === "granted") {
                        new Notification("ZenTime", {
                            body: "Session complete. Time to switch gears!",
                            icon: "https://cdn-icons-png.flaticon.com/512/2523/2523315.png"
                        });
                    } else {
                        alert("Session complete!");
                    }
                };

                const toggleTimer = () => {
                    if (Notification.permission === 'default') requestNotification();

                    if (isPlaying.value) {
                        clearInterval(timerId);
                        timerId = null;
                        isPlaying.value = false;
                    } else {
                        isPlaying.value = true;
                        timerId = setInterval(() => {
                            timeLeft.value--;
                            if (timeLeft.value <= 0) {
                                clearInterval(timerId);
                                timerId = null;
                                isPlaying.value = false;
                                notify();

                                setTimeout(() => {
                                    timeLeft.value = totalTime.value;
                                }, 2000);
                            }
                        }, 1000);
                    }
                };

                const resetTimer = () => {
                    if (timerId) {
                        clearInterval(timerId);
                        timerId = null;
                    }
                    timeLeft.value = totalTime.value;
                    isPlaying.value = false;
                };

                onMounted(() => {
                    if (Notification.permission === 'granted') {
                        notificationEnabled.value = true;
                        notificationStatus.value = 'Notifications Enabled';
                    }
                });

                return {
                    modes,
                    activeMode,
                    timeLeft,
                    totalTime,
                    isPlaying,
                    currentModeLabel,
                    formattedTime,
                    progressOffset,
                    circumference,
                    notificationStatus,
                    notificationEnabled,
                    setMode,
                    toggleTimer,
                    resetTimer,
                    requestNotification
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
