            marked.use(extension());
        }

        // Highlight Extension (==text==)
        const highlightExtension = {
            name: 'highlight',
            level: 'inline',
            start(src) { return src.match(/==/)?.index; },
            tokenizer(src, tokens) {
                const rule = /^==([^=]+)==/;
                const match = rule.exec(src);
                if (match) {
                    return { type: 'highlight', raw: match[0], text: match[1] };
                }
            },
            renderer(token) { return `<mark class="bg-yellow-200 px-1 rounded text-slate-900">${token.text}</mark>`; }
        };

        // Sub/Sup Extension (~sub~, ^sup^)
        const subSupExtension = {
            name: 'subSup',
            level: 'inline',
            start(src) { return src.match(/[~^]/)?.index; },
            tokenizer(src, tokens) {
                const subRule = /^~([^~]+)~/;
                const supRule = /^\^([^^]+)\^/;
                let match;
                if (match = subRule.exec(src)) return { type: 'subSup', raw: match[0], text: match[1], tag: 'sub' };
                if (match = supRule.exec(src)) return { type: 'subSup', raw: match[0], text: match[1], tag: 'sup' };
            },
            renderer(token) { return `<${token.tag} class="text-[0.8em]">${token.text}</${token.tag}>`; }
        };

        // Mention Extension (@user)
        const mentionExtension = {
            name: 'mention',
            level: 'inline',
            start(src) { return src.match(/@/)?.index; },
            tokenizer(src, tokens) {
                const rule = /^@([a-zA-Z0-9_]+)/;
                const match = rule.exec(src);
                if (match) return { type: 'mention', raw: match[0], user: match[1] };
            },
            renderer(token) { return `<span class="mention bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-md font-medium text-[0.9em]">@${token.user}</span>`; }
        };

        // Issue Extension (#123)
        const issueExtension = {
            name: 'issue',
            level: 'inline',
            start(src) { return src.match(/#/)?.index; },
            tokenizer(src, tokens) {
                const rule = /^#([0-9]+)/;
                const match = rule.exec(src);
                if (match) return { type: 'issue', raw: match[0], id: match[1] };
            },
            renderer(token) { return `<span class="issue text-emerald-600 font-semibold text-[0.9em]">#${token.id}</span>`; }
        };

        marked.use({
            breaks: true,
            extensions: [highlightExtension, subSupExtension, mentionExtension, issueExtension]
        });

        // Definition List Extension
        const definitionListExtension = {
            name: 'definitionList',
            level: 'block',
            start(src) { return src.match(/[^\n]+\n:/)?.index; },
            tokenizer(src, tokens) {
                const rule = /^([^\n]+)\n: ([^\n]+)(?:\n|$)/;
                const match = rule.exec(src);
                if (match) {
                    return {
                        type: 'definitionList',
                        raw: match[0],
                        dt: match[1].trim(),
                        dd: match[2].trim()
                    };
                }
            },
            renderer(token) {
                return `<dl><dt>${token.dt}</dt><dd>${token.dd}</dd></dl>`;
            }
        };
        marked.use({ extensions: [definitionListExtension] });

        // Custom renderer for Mermaid
        marked.use({
            renderer: {
                code(obj) {
                    // Support both old (code, lang) and new ({text, lang}) signatures
                    const code = typeof obj === 'object' ? obj.text : arguments[0];
                    const lang = typeof obj === 'object' ? obj.lang : arguments[1];

                    if (lang === 'mermaid') {
                        return `<pre class="mermaid">${code}</pre>`;
                    }
                    return false; // fallback to default
                }
            }
        });

                    });
                } catch (err) {
                    console.error('Mermaid error:', err);
                }
            }
        }

        editor.addEventListener('input', updatePreview);
        updatePreview(); // initial render

            editor.value = '';
            updatePreview();
