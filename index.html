<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissWeb</title>
    <meta name="description" content="A comprehensive collection of developer tools including JSON formatter, Markdown editor, PDF utilities, and more.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <link href="/style.css" rel="stylesheet">
    <link rel="icon" href="/logo.png" type="image/png">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P6F464KX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<nav class="global-nav">
    <a href="/" class="global-nav-brand">
        <img src="/logo.png" alt="Logo" class="global-nav-icon">
        Swiss<span>Web</span>
    </a>
    <div class="global-nav-links">
        <a href="/" class="global-nav-link">Home</a>
    </div>
</nav>

    <div id="app" class="container" v-cloak>
        <div class="controls">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    v-model="searchQuery" 
                    class="search-input" 
                    placeholder="Search tools by name or description..."
                >
            </div>
            
            <div class="categories">
                <button 
                    v-for="cat in categories" 
                    :key="cat"
                    class="category-btn"
                    :class="{ active: activeCategory === cat }"
                    @click="activeCategory = cat"
                >
                    {{ cat }}
                </button>
            </div>
        </div>

        <transition-group name="list" tag="main" class="tools-grid">
            <a 
                v-for="tool in filteredTools" 
                :key="tool.name" 
                :href="tool.url" 
                class="tool-card"
            >
                <div class="card-header">
                    <div class="icon-wrapper">{{ tool.icon }}</div>
                    <button 
                        class="star-btn" 
                        :class="{ active: isFavorite(tool.name) }"
                        @click.prevent="toggleFavorite(tool.name)"
                        title="Toggle Favorite"
                    >
                        ★
                    </button>
                </div>
                <h2 class="tool-title">{{ tool.name }}</h2>
                <p class="tool-desc">{{ tool.desc }}</p>
                <div class="tool-category">{{ tool.category }}</div>
            </a>
            
            <div v-if="filteredTools.length === 0" key="empty" class="empty-state">
                <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">📭</div>
                <h3>No tools found matching your criteria.</h3>
                <p style="margin-top: 0.5rem;">Try adjusting your search or category filter.</p>
            </div>
        </transition-group>

        <footer style="text-align: center; margin-top: 4rem; padding-bottom: 2rem; color: var(--text-secondary); font-size: 0.875rem; opacity: 0.7;">
            Made with ❤️ by Bikram
        </footer>
    </div>

    <script>
        const { createApp, ref, computed, watch, onMounted } = Vue;

        createApp({
            setup() {
                const tools = ref([
                    { name: 'PDF Utilities', url: './pdf/', icon: '📄', desc: 'Merge, split, compress, and manipulate your PDF documents locally.', category: 'Utilities' },
                    { name: 'Image Tools', url: './image/', icon: '🖼️', desc: 'Quickly process, convert, and manipulate your images right in the browser.', category: 'Media' },
                    { name: 'Pomodoro Timer', url: './pomo/', icon: '⏱️', desc: 'Boost your focus and productivity with the proven Pomodoro technique.', category: 'Productivity' },
                    { name: 'News Reader', url: './news/', icon: '📰', desc: 'Stay updated with the latest headlines and articles in a clean interface.', category: 'Utilities' },
                    { name: 'Mind Map', url: './mind/', icon: '🧠', desc: 'Visualize your thoughts, brainstorm, and organize complex ideas graphically.', category: 'Productivity' },
                    { name: 'Markdown Editor', url: './md/', icon: '📝', desc: 'Write, edit, and preview markdown with real-time rendering capabilities.', category: 'Developer' },
                    { name: 'Audio Studio', url: './audio/', icon: '🎵', desc: 'Trim, convert formats, and process your audio files entirely in the browser.', category: 'Media' },
                    { name: 'Decision Maker', url: './decide/', icon: '⚖️', desc: 'Make choices easier with this interactive decision wheel and tool.', category: 'Productivity' },
                    { name: 'Finance Engine', url: './finance/', icon: '💰', desc: 'Investment comparison engine with post-tax compounded wealth projections.', category: 'Finance' },
                    { name: 'JSON Formatter', url: './json/', icon: '⚙️', desc: 'Format, parse, minify, and validate your JSON data structures easily.', category: 'Developer' },
                    { name: 'Quiz Maker', url: './quiz/', icon: '❓', desc: 'Create, test, and take interactive quizzes for learning and assessment.', category: 'Productivity' },
                    { name: 'Signal Scope', url: './signal/', icon: '📡', desc: "Visualize real-time audio from your sound card's line-in with waveform and spectrum views.", category: 'Media' },
                    { name: 'Serial Monitor', url: './serial/', icon: '🔌', desc: 'Read and display real-time USB serial data in the browser. Supports custom baud rates, send commands, and export logs.', category: 'Developer' }
                ]);

                const categories = ['All', 'Favorites', 'Developer', 'Productivity', 'Media', 'Finance', 'Utilities'];
                
                const searchQuery = ref('');
                const activeCategory = ref('All');
                const favorites = ref([]);

                // Load favorites from localStorage
                onMounted(() => {
                    const saved = localStorage.getItem('swissweb_favorites');
                    if (saved) {
                        try {
                            favorites.value = JSON.parse(saved);
                        } catch (e) {}
                    }
                });

                // Save favorites to localStorage
                watch(favorites, (newFavs) => {
                    localStorage.setItem('swissweb_favorites', JSON.stringify(newFavs));
                }, { deep: true });

                const isFavorite = (name) => {
                    return favorites.value.includes(name);
                };

                const toggleFavorite = (name) => {
                    if (isFavorite(name)) {
                        favorites.value = favorites.value.filter(fav => fav !== name);
                    } else {
                        favorites.value.push(name);
                    }
                };

                const filteredTools = computed(() => {
                    let result = tools.value;

                    // Filter by category
                    if (activeCategory.value === 'Favorites') {
                        result = result.filter(t => isFavorite(t.name));
                    } else if (activeCategory.value !== 'All') {
                        result = result.filter(t => t.category === activeCategory.value);
                    }

                    // Filter by search query
                    if (searchQuery.value.trim()) {
                        const query = searchQuery.value.toLowerCase();
                        result = result.filter(t => 
                            t.name.toLowerCase().includes(query) || 
                            t.desc.toLowerCase().includes(query)
                        );
                    }

                    // Sort: Favorites first (if not in 'Favorites' tab)
                    if (activeCategory.value !== 'Favorites') {
                        result = [...result].sort((a, b) => {
                            const aFav = isFavorite(a.name) ? 1 : 0;
                            const bFav = isFavorite(b.name) ? 1 : 0;
                            return bFav - aFav; // Higher priority to 1
                        });
                    }

                    return result;
                });

                return {
                    tools,
                    categories,
                    searchQuery,
                    activeCategory,
                    filteredTools,
                    isFavorite,
                    toggleFavorite
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
