<header class="border-b border-zinc-900 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-40 w-full">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex-1 flex items-center gap-4">
        <a class="flex items-center gap-2 font-bold text-white text-lg" href="/">
          <img class="h-8 w-auto" src="/logo.svg" alt="Logo">
          <span>Swiss<span class="text-cyan-500">Web</span></span>
        </a>
        <div class="border-l border-slate-700 pl-4 ml-4">
          <h1 class="text-sm font-semibold text-slate-300">News NOW</h1>

      <div class="flex items-center gap-2">
        <button onclick="openSettings()" class="p-2 rounded-lg border border-slate-800 bg-slate-900 text-zinc-400 hover:text-white transition cursor-pointer" title="Source Settings">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>

<!-- Categories Navigation -->
<div class="max-w-screen-xl w-full mx-auto px-4 mt-6">
  <div class="flex justify-center border-b border-zinc-900" id="nav">
    <nav class="-mb-px flex gap-6 overflow-x-auto pb-0.5" aria-label="Categories">
      <button id="btn-national" onclick="switchCategory('national')" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-zinc-400 hover:text-slate-200 transition cursor-pointer">National</button>
      <button id="btn-business" onclick="switchCategory('business')" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-zinc-400 hover:text-slate-200 transition cursor-pointer">Business</button>
      <button id="btn-tech" onclick="switchCategory('tech')" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-zinc-400 hover:text-slate-200 transition cursor-pointer">Technology</button>
      <button id="btn-world" onclick="switchCategory('world')" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-zinc-400 hover:text-slate-200 transition cursor-pointer">World</button>
      <button id="btn-kids" onclick="switchCategory('kids')" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-zinc-400 hover:text-slate-200 transition cursor-pointer">🧒 Kids</button>
      <button onclick="fetchAll()" class="shrink-0 border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-cyan-400 hover:text-cyan-300 transition cursor-pointer">↻ All</button>

<!-- ── SETTINGS OVERLAY ── -->
<div id="settings-overlay" onclick="closeSettings()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

<!-- ── SETTINGS DRAWER ── -->
<div id="settings-drawer" class="fixed inset-y-0 right-0 z-50 flex max-w-full pl-10 transform translate-x-full transition-transform duration-300" role="dialog">
  <div class="w-screen max-w-md bg-slate-900 border-l border-slate-800 shadow-2xl flex flex-col justify-between">
    <div class="px-6 py-4 border-b border-slate-850 flex justify-between items-center bg-zinc-950/20">
      <span class="text-sm font-bold text-zinc-100">⚙ Source Settings</span>
      <button aria-label="Close settings" class="text-slate-450 hover:text-white cursor-pointer" onclick="closeSettings()">
        <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewBox="0 0 24 24" width="16"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      <div>
        <p class="text-2xs font-bold text-slate-500 uppercase tracking-wider mb-4">Enable / disable sources</p>
        <div id="settings-sources-list" class="space-y-3"></div>
      </div>
      
      <div class="border-t border-slate-850 pt-6">
        <p class="text-2xs font-bold text-slate-500 uppercase tracking-wider mb-4">Add a custom RSS feed</p>
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-2xs font-semibold text-slate-450 mb-1" for="input-feed-name">Display name</label>
              <input autocomplete="off" class="w-full rounded-lg border border-slate-800 bg-zinc-950 px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-cyan-500" id="input-feed-name" placeholder="e.g. BBC India" type="text"/>
            </div>
            <div>
              <label class="block text-2xs font-semibold text-slate-450 mb-1" for="input-feed-category">Category</label>
              <select class="w-full rounded-lg border border-slate-800 bg-zinc-950 px-3 py-2 text-xs text-slate-350 focus:outline-none focus:border-cyan-500" id="input-feed-category">
                <option value="national">National</option>
                <option value="business">Business</option>
                <option value="tech">Technology</option>
                <option value="world">International</option>
                <option value="kids">Kids</option>
                <option value="custom">Custom</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-2xs font-semibold text-slate-450 mb-1" for="input-feed-url">RSS feed URL</label>
            <input autocomplete="off" class="w-full rounded-lg border border-slate-800 bg-zinc-950 px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-cyan-500" id="input-feed-url" placeholder="https://example.com/feed.rss" type="url"/>
          </div>
          <div class="text-2xs" id="form-msg"></div>
          <button class="w-full py-2 bg-cyan-650 hover:bg-cyan-700 text-white rounded-lg text-xs font-bold transition cursor-pointer" onclick="addCustomFeed()">+ Add feed</button>
        </div>
      </div>
    </div>
    
    <div class="px-6 py-4 border-t border-slate-850 bg-zinc-950/20 flex flex-col gap-3">
      <span class="text-3xs text-slate-500">Settings saved automatically in your browser.</span>
      <button class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg text-xs font-bold transition cursor-pointer" onclick="applyAndClose()">Apply &amp; refresh</button>
    </div>
  </div>
</div>

<main class="max-w-screen-xl w-full mx-auto px-4 flex-1 py-8">
  <div id="loading" class="flex flex-col items-center justify-center py-20 text-sm text-zinc-400 gap-3">
    <div class="w-8 h-8 border-4 border-slate-800 border-t-indigo-500 rounded-full animate-spin"></div>
    Fetching latest headlines…
  </div>
  
  <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<footer class="bg-slate-955 py-8 border-t border-zinc-900 text-center">
  <p class="text-xs text-slate-500">Made with ❤️ by Bikram</p>
</footer>

<script>
    // ─────────────────────────────────────────────
    //  DEFAULT SOURCES  (built-in, can be toggled)
    // ─────────────────────────────────────────────
    const DEFAULT_SOURCES = [
        // ── India: National ──
        { id: 'the-hindu',          name: 'The Hindu',          category: 'national', url: 'https://www.thehindu.com/news/national/feeder/default.rss', builtin: true },
        { id: 'indian-express',     name: 'Indian Express',     category: 'national', url: 'https://indianexpress.com/feed/', builtin: true },
        { id: 'ndtv-india',         name: 'NDTV India',         category: 'national', url: 'https://feeds.feedburner.com/ndtvnews-india-news', builtin: true },
        // ── India: Business ──
        { id: 'economic-times',     name: 'Economic Times',     category: 'business', url: 'https://economictimes.indiatimes.com/rssfeedsdefault.cms', builtin: true },
        { id: 'financial-express',  name: 'Financial Express',  category: 'business', url: 'https://www.financialexpress.com/feed/', builtin: true },
        // ── India: Tech ──
        { id: 'gadgets360',         name: 'Gadgets 360',        category: 'tech',     url: 'https://feeds.feedburner.com/gadgets360-latest', builtin: true },
        // ── International: World News ──
        { id: 'bbc-world',          name: 'BBC News',           category: 'world',    url: 'https://feeds.bbci.co.uk/news/world/rss.xml', builtin: true },
        { id: 'reuters-world',      name: 'Reuters',            category: 'world',    url: 'https://feeds.reuters.com/reuters/topNews', builtin: true },
        { id: 'ap-news',            name: 'AP News',            category: 'world',    url: 'https://feeds.apnews.com/rss/apf-topnews', builtin: true },
        { id: 'al-jazeera',         name: 'Al Jazeera',         category: 'world',    url: 'https://www.aljazeera.com/xml/rss/all.xml', builtin: true },
        { id: 'guardian-world',     name: 'The Guardian',       category: 'world',    url: 'https://www.theguardian.com/world/rss', builtin: true },
        { id: 'dw-world',           name: 'DW News',            category: 'world',    url: 'https://rss.dw.com/rdf/rss-en-world', builtin: true },
        { id: French_france24 => 'france24', name: 'France 24', category: 'world',    url: 'https://www.france24.com/en/rss', builtin: true },
        // ── International: Business ──
        { id: 'ft-world',           name: 'Financial Times',    category: 'world',    url: 'https://www.ft.com/?format=rss', builtin: true },
        { id: 'bloomberg',          name: 'Bloomberg',          category: 'world',    url: 'https://feeds.bloomberg.com/markets/news.rss', builtin: true },
        // ── International: Tech ──
        { id: 'techcrunch',         name: 'TechCrunch',         category: 'world',    url: 'https://techcrunch.com/feed/', builtin: true },
        { id: 'ars-technica',       name: 'Ars Technica',       category: 'world',    url: 'https://feeds.arstechnica.com/arstechnica/index', builtin: true },
        { id: 'wired',              name: 'Wired',              category: 'world',    url: 'https://www.wired.com/feed/rss', builtin: true },
        // ── Kids: India ──
        { id: 'down-to-earth',      name: 'Down to Earth 🇮🇳',  category: 'kids',     url: 'https://www.downtoearth.org.in/feed', builtin: true },
        { id: 'better-india',       name: 'The Better India 🇮🇳', category: 'kids',   url: 'https://www.thebetterindia.com/feed/', builtin: true },
        // ── Kids: International ──
        { id: 'nasa-news',          name: 'NASA News',          category: 'kids',     url: 'https://www.nasa.gov/rss/dyn/breaking_news.rss', builtin: true },
        { id: 'sci-news-students',  name: 'Science News Explores', category: 'kids', url: 'https://www.snexplores.org/feed', builtin: true },
        { id: 'natgeo-kids',        name: 'Nat Geo Kids',       category: 'kids',     url: 'https://feeds.nationalgeographic.com/ng/News/News_Main', builtin: true },
        { id: 'smithsonian-tween',  name: 'Smithsonian Magazine', category: 'kids',   url: 'https://www.smithsonianmag.com/rss/latest_articles/', builtin: true },
        { id: 'dk-findout',         name: 'BBC Science Focus',  category: 'kids',     url: 'https://www.sciencefocus.com/feed', builtin: true },
        { id: 'kids-discover',      name: 'Popular Science',    category: 'kids',     url: 'https://www.popsci.com/feed/', builtin: true },
    ];

    // Typo correction for france24 id
    DEFAULT_SOURCES.forEach(s => {
        if(s.id && typeof s.id === 'object') {
            s.id = 'france24';
        }
    });

    const LS_KEY = 'newsnow_settings_v1';

    // ─────────────────────────────────────────────
    //  SETTINGS STORE — load / save / merge
    // ─────────────────────────────────────────────
    function loadSettings() {
        try {
            const raw = localStorage.getItem(LS_KEY);
            if (raw) return JSON.parse(raw);
        } catch (_) {}
        // default: all builtin sources enabled, no custom
        return {
            disabled: [],       // array of source IDs that are turned off
            custom: []          // array of { id, name, category, url }
        };
    }

    function saveSettings(settings) {
        localStorage.setItem(LS_KEY, JSON.stringify(settings));
    }

    // Returns full list (builtin + custom) with enabled flag
    function getActiveSources(settings) {
        const all = [
            ...DEFAULT_SOURCES,
            ...settings.custom
        ];
        return all.filter(s => !settings.disabled.includes(s.id));
    }

    // ─────────────────────────────────────────────
    //  DOM refs
    // ─────────────────────────────────────────────
    const container = document.getElementById('news-container');
    const loader    = document.getElementById('loading');

    // ─────────────────────────────────────────────
    //  SETTINGS DRAWER
    // ─────────────────────────────────────────────
    let settingsOpen = false;
    let currentSettings = loadSettings();

    function openSettings() {
        settingsOpen = true;
        currentSettings = loadSettings();
        renderSettingsPanel();
        
        const overlay = document.getElementById('settings-overlay');
        const drawer = document.getElementById('settings-drawer');
        overlay.classList.remove('hidden');
        setTimeout(() => {
            overlay.classList.add('opacity-100');
            drawer.classList.remove('translate-x-full');
        }, 10);
        document.body.style.overflow = 'hidden';
    }

    function closeSettings() {
        settingsOpen = false;
        const overlay = document.getElementById('settings-overlay');
        const drawer = document.getElementById('settings-drawer');
        drawer.classList.add('translate-x-full');
        overlay.classList.remove('opacity-100');
        setTimeout(() => {
            overlay.classList.add('hidden');
        }, 300);
        document.body.style.overflow = '';
    }

    function applyAndClose() {
        saveSettings(currentSettings);
        closeSettings();
        fetchAll();
    }

    function renderSettingsPanel() {
        const list = document.getElementById('settings-sources-list');
        const allSources = [...DEFAULT_SOURCES, ...currentSettings.custom];

        // Group by category
        const cats = {};
        allSources.forEach(s => {
            if (!cats[s.category]) cats[s.category] = [];
            cats[s.category].push(s);
        });

        const catOrder = ['national', 'business', 'tech', 'world', 'kids', 'custom'];
        const catLabels = { national: 'National', business: 'Business', tech: 'Technology', world: 'International', kids: '🧒 Kids', custom: 'Custom' };

        list.innerHTML = catOrder.filter(c => cats[c]).map(cat => `
            <div class="space-y-2">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-4 mb-2">${catLabels[cat] || cat}</div>
                <div class="space-y-2">${cats[cat].map(src => sourceRowHTML(src)).join('')}</div>
            </div>
        `).join('');
    }

    function sourceRowHTML(src) {
        const enabled = !currentSettings.disabled.includes(src.id);
        const isCustom = !src.builtin;
        return `
        <div class="flex items-center justify-between p-3 rounded-lg border border-slate-800 bg-zinc-950/40 hover:border-slate-700 transition" id="row-${src.id}">
            <div class="flex-1 min-w-0 pr-3">
                <span class="block text-xs font-bold text-slate-200 truncate">${src.name}</span>
                <span class="block text-[10px] text-slate-550 truncate mt-0.5">${src.url}</span>
            </div>
            <div class="flex items-center gap-2">
                ${isCustom ? `<button class="text-slate-500 hover:text-red-400 transition cursor-pointer p-1" onclick="deleteCustomSource('${src.id}')" title="Remove">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>` : ''}
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSource('${src.id}', this.checked)" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-850 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-550 after:border-slate-550 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-650 peer-checked:after:bg-white"></div>
                </label>
            </div>
        </div>`;
    }

    function toggleSource(id, enabled) {
        if (enabled) {
            currentSettings.disabled = currentSettings.disabled.filter(x => x !== id);
        } else {
            if (!currentSettings.disabled.includes(id)) currentSettings.disabled.push(id);
        }
        // auto-save on toggle
        saveSettings(currentSettings);
    }

    function deleteCustomSource(id) {
        currentSettings.custom = currentSettings.custom.filter(s => s.id !== id);
        currentSettings.disabled = currentSettings.disabled.filter(x => x !== id);
        saveSettings(currentSettings);
        renderSettingsPanel();
    }

    function addCustomFeed() {
        const name = document.getElementById('input-feed-name').value.trim();
        const url  = document.getElementById('input-feed-url').value.trim();
        const cat  = document.getElementById('input-feed-category').value;
        const msg  = document.getElementById('form-msg');

        msg.className = 'text-2xs';

        if (!name) { showMsg('text-red-400', 'Please enter a display name.'); return; }
        if (!url || !url.startsWith('http')) { showMsg('text-red-400', 'Please enter a valid feed URL.'); return; }

        const id = 'custom-' + Date.now();
        const newFeed = { id, name, category: cat, url, builtin: false };
        currentSettings.custom.push(newFeed);
        saveSettings(currentSettings);
        renderSettingsPanel();

        document.getElementById('input-feed-name').value = '';
        document.getElementById('input-feed-url').value  = '';
        showMsg('text-green-400', `"${name}" added successfully.`);
    }

    function showMsg(type, text) {
        const msg = document.getElementById('form-msg');
        msg.textContent = text;
        msg.className = 'text-2xs ' + type;
        setTimeout(() => { msg.className = 'text-2xs'; msg.textContent = ''; }, 3500);
    }

    // ─────────────────────────────────────────────
    //  NEWS FETCHING
    // ─────────────────────────────────────────────
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function fetchRSS(feed) {
        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
        try {
            const res  = await fetch(proxyUrl);
            if (res.status === 429) {
                console.warn(`Rate limited (${feed.name}), retrying after 1s…`);
                await delay(1000);
                const retry = await fetch(proxyUrl);
                const data  = await retry.json();
                return (data.items || []).map(item => ({ ...item, source: feed.name }));
            }
            const data = await res.json();
            return (data.items || []).map(item => ({ ...item, source: feed.name }));
        } catch (err) {
            console.error(`Feed error (${feed.name}):`, err);
            return [];
        }
    }

    // Fetch feeds sequentially with a small gap to avoid proxy rate-limits
    async function fetchAllFeeds(feeds) {
        const results = [];
        for (const feed of feeds) {
            results.push(await fetchRSS(feed));
            await delay(300);
        }
        return results;
    }

    function setActiveBtn(cat) {
        document.querySelectorAll('#nav button').forEach(b => {
            b.classList.remove('border-cyan-500', 'text-cyan-400');
            b.classList.add('border-transparent', 'text-zinc-400');
        });
        const btn = document.getElementById('btn-' + cat);
        if (btn) {
            btn.classList.remove('border-transparent', 'text-zinc-400');
            btn.classList.add('border-cyan-500', 'text-cyan-400');
        }
    }

    async function switchCategory(cat) {
        setActiveBtn(cat);
        loader.style.display = 'flex';
        container.innerHTML = '';
        const settings = loadSettings();
        const active = getActiveSources(settings).filter(s => s.category === cat);
        if (!active.length) {
            loader.style.display = 'none';
            container.innerHTML = `<p class="text-slate-500 text-center py-20 w-full col-span-full">
                No sources enabled for this category. Open Settings (⚙) to add some.
            </p>`;
            return;
        }
        const stories = await fetchAllFeeds(active);
        window.lastFetchedStories = stories.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        renderNews(window.lastFetchedStories);
    }

    async function fetchAll() {
        document.querySelectorAll('#nav button').forEach(b => {
            b.classList.remove('border-cyan-500', 'text-cyan-400');
            b.classList.add('border-transparent', 'text-zinc-400');
        });
        loader.style.display = 'flex';
        container.innerHTML = '';
        const settings = loadSettings();
        const active = getActiveSources(settings);
        if (!active.length) {
            loader.style.display = 'none';
            container.innerHTML = `<p class="text-slate-500 text-center py-20 w-full col-span-full">
                No sources enabled. Open Settings (⚙) to enable some.
            </p>`;
            return;
        }
        const stories = await fetchAllFeeds(active);
        window.lastFetchedStories = stories.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        renderNews(window.lastFetchedStories);
    }

    function formatDate(str) {
        const d = new Date(str);
        if (isNaN(d)) return { date: '', time: '' };
        const date = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
        return { date, time };
    }

    function renderNews(stories) {
        loader.style.display = 'none';
        if (!stories.length) {
            container.innerHTML = `<p class="text-slate-500 text-center py-20 w-full col-span-full">No stories found. Check your connection.</p>`;
            return;
        }

        container.innerHTML = stories.map((post, i) => {
            const pubDateFormatted = formatDate(post.pubDate);
            const imgSrc = post.thumbnail || post.enclosure?.link;
            const desc = (post.description || '').replace(/<[^>]*>?/gm, '').trim();

            const imgHtml = imgSrc
                ? `<div class="aspect-video w-full overflow-hidden bg-slate-900 border-b border-slate-950"><img src="${imgSrc}" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.parentElement.outerHTML=noImgHtml()"></div>`
                : noImgHtml();

            return `
            <article class="group flex flex-col rounded-xl border border-zinc-900 bg-zinc-900/50 overflow-hidden shadow-sm hover:border-slate-800 transition duration-300">
                ${imgHtml}
                <div class="p-6 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="inline-flex items-center justify-center rounded-full bg-cyan-950/60 border border-cyan-900/40 px-2.5 py-0.5 text-[10px] font-semibold text-cyan-400">
                                ${post.source}
                            </span>
                            <span class="text-[10px] text-slate-500 flex items-center gap-1">
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                ${pubDateFormatted.date}
                            </span>
                        </div>
                        
                        <h3 class="text-sm font-bold text-white group-hover:text-cyan-400 transition-colors line-clamp-2 leading-snug">
                            ${post.title}
                        </h3>
                        
                        ${desc ? `<p class="mt-2 text-xs text-zinc-400 line-clamp-3 leading-relaxed">${desc}</p>` : ''}
                    </div>
                    
                    <div class="mt-5 border-t border-slate-850/60 pt-3.5 flex justify-end">
                        <a href="${post.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-semibold text-cyan-400 hover:text-cyan-300">
                            Read article
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                            </svg>
                        </a>
                    </div>
                </div>
            </article>`;
        }).join('');
    }

    function noImgSvg() {
        return `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
    }

    function noImgHtml() {
        return `<div class="aspect-video w-full bg-slate-900 border-b border-slate-950 flex items-center justify-center">${noImgSvg()}</div>`;
    }

    function noListImgSvg() {
        return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
    }

    function noListImgHtml() {
        return `<div class="w-8 h-8 rounded bg-slate-900 border border-slate-950 flex items-center justify-center">${noListImgSvg()}</div>`;
    }

    // Keyboard: Escape closes drawer
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && settingsOpen) closeSettings(); });

    // Initial load
    switchCategory('national');
</script>
</body>
</html>
