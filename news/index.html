<!-- ── SETTINGS OVERLAY ── -->
<div id="settings-overlay" onclick="closeSettings()"></div>
<!-- ── SETTINGS DRAWER ── -->
<div aria-label="Source settings" id="settings-drawer" role="dialog">
<div class="drawer-header">

<button aria-label="Close settings" class="drawer-close" id="btn-drawer-close" onclick="closeSettings()">
<svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-width="2.5" viewbox="0 0 24 24" width="14"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</button>
</div>
<div class="drawer-body">
<p class="settings-section-label">Enable / disable sources</p>
<div id="settings-sources-list"></div>
<div class="settings-divider"></div>
<p class="settings-section-label" style="margin-bottom:1rem;">Add a custom RSS feed</p>
<div class="add-feed-form">
<div class="form-row">
<div class="form-group">
<label class="form-label" for="input-feed-name">Display name</label>
<input autocomplete="off" class="form-input" id="input-feed-name" placeholder="e.g. BBC India" type="text"/>
</div>
<div class="form-group">
<label class="form-label" for="input-feed-category">Category</label>
<select class="form-select" id="input-feed-category">
<option value="national">National</option>
<option value="business">Business</option>
<option value="tech">Technology</option>
<option value="world">International</option>

</select>
</div>
</div>

<label class="form-label" for="input-feed-url">RSS feed URL</label>
<input autocomplete="off" class="form-input" id="input-feed-url" placeholder="https://example.com/feed.rss" type="url"/>
</div>

<button class="btn-add-feed" onclick="addCustomFeed()">+ Add feed</button>
</div>

</div>

<main class="news-main">

            Fetching latest headlines…
        </div>

</main>

<script>
    // ─────────────────────────────────────────────
    //  DEFAULT SOURCES  (built-in, can be toggled)
    // ─────────────────────────────────────────────
    const DEFAULT_SOURCES = [
        // ── India: National ──
        { id: 'the-hindu',          name: 'The Hindu',          category: 'national', url: 'https://www.thehindu.com/news/national/feeder/default.rss', builtin: true },
        { id: 'indian-express',     name: 'Indian Express',     category: 'national', url: 'https://indianexpress.com/feed/', builtin: true },
        { id: 'ndtv-india',         name: 'NDTV India',         category: 'national', url: 'https://feeds.feedburner.com/ndtvnews-india-news', builtin: true },
        // ── India: Business ──
        { id: 'economic-times',     name: 'Economic Times',     category: 'business', url: 'https://economictimes.indiatimes.com/rssfeedsdefault.cms', builtin: true },
        { id: 'financial-express',  name: 'Financial Express',  category: 'business', url: 'https://www.financialexpress.com/feed/', builtin: true },
        // ── India: Tech ──
        { id: 'gadgets360',         name: 'Gadgets 360',        category: 'tech',     url: 'https://feeds.feedburner.com/gadgets360-latest', builtin: true },
        // ── International: World News ──
        { id: 'bbc-world',          name: 'BBC News',           category: 'world',    url: 'http://feeds.bbci.co.uk/news/world/rss.xml', builtin: true },
        { id: 'reuters-world',      name: 'Reuters',            category: 'world',    url: 'https://feeds.reuters.com/reuters/topNews', builtin: true },
        { id: 'ap-news',            name: 'AP News',            category: 'world',    url: 'https://feeds.apnews.com/rss/apf-topnews', builtin: true },
        { id: 'al-jazeera',         name: 'Al Jazeera',         category: 'world',    url: 'https://www.aljazeera.com/xml/rss/all.xml', builtin: true },
        { id: 'guardian-world',     name: 'The Guardian',       category: 'world',    url: 'https://www.theguardian.com/world/rss', builtin: true },
        { id: 'dw-world',           name: 'DW News',            category: 'world',    url: 'https://rss.dw.com/rdf/rss-en-world', builtin: true },
        { id: 'france24',           name: 'France 24',          category: 'world',    url: 'https://www.france24.com/en/rss', builtin: true },
        // ── International: Business ──
        { id: 'ft-world',           name: 'Financial Times',    category: 'world',    url: 'https://www.ft.com/?format=rss', builtin: true },
        { id: 'bloomberg',          name: 'Bloomberg',          category: 'world',    url: 'https://feeds.bloomberg.com/markets/news.rss', builtin: true },
        // ── International: Tech ──
        { id: 'techcrunch',         name: 'TechCrunch',         category: 'world',    url: 'https://techcrunch.com/feed/', builtin: true },
        { id: 'ars-technica',       name: 'Ars Technica',       category: 'world',    url: 'http://feeds.arstechnica.com/arstechnica/index', builtin: true },
        { id: 'wired',              name: 'Wired',              category: 'world',    url: 'https://www.wired.com/feed/rss', builtin: true },
        // ── Kids: India ──
        { id: 'down-to-earth',      name: 'Down to Earth 🇮🇳',  category: 'kids',     url: 'https://www.downtoearth.org.in/feed', builtin: true },
        { id: 'better-india',       name: 'The Better India 🇮🇳', category: 'kids',   url: 'https://www.thebetterindia.com/feed/', builtin: true },
        // ── Kids: International ──
        { id: 'nasa-news',          name: 'NASA News',          category: 'kids',     url: 'https://www.nasa.gov/rss/dyn/breaking_news.rss', builtin: true },
        { id: 'sci-news-students',  name: 'Science News Explores', category: 'kids', url: 'https://www.snexplores.org/feed', builtin: true },
        { id: 'natgeo-kids',        name: 'Nat Geo Kids',       category: 'kids',     url: 'https://feeds.nationalgeographic.com/ng/News/News_Main', builtin: true },
        { id: 'smithsonian-tween',  name: 'Smithsonian Magazine', category: 'kids',   url: 'https://www.smithsonianmag.com/rss/latest_articles/', builtin: true },
        { id: 'dk-findout',         name: 'BBC Science Focus',  category: 'kids',     url: 'https://www.sciencefocus.com/feed', builtin: true },
        { id: 'kids-discover',      name: 'Popular Science',    category: 'kids',     url: 'https://www.popsci.com/feed/', builtin: true },
    ];

    const LS_KEY = 'newsnow_settings_v1';

    // ─────────────────────────────────────────────
    //  SETTINGS STORE — load / save / merge
    // ─────────────────────────────────────────────
    function loadSettings() {
        try {
            const raw = localStorage.getItem(LS_KEY);
            if (raw) return JSON.parse(raw);
        } catch (_) {}
        // default: all builtin sources enabled, no custom
        return {
            disabled: [],       // array of source IDs that are turned off
            custom: []          // array of { id, name, category, url }
        };
    }

    function saveSettings(settings) {
        localStorage.setItem(LS_KEY, JSON.stringify(settings));
    }

    // Returns full list (builtin + custom) with enabled flag
    function getActiveSources(settings) {
        const all = [
            ...DEFAULT_SOURCES,
            ...settings.custom
        ];
        return all.filter(s => !settings.disabled.includes(s.id));
    }

    // ─────────────────────────────────────────────
    //  DOM refs
    // ─────────────────────────────────────────────
    const container = document.getElementById('news-container');
    const loader    = document.getElementById('loading');

    // ─────────────────────────────────────────────
    //  SETTINGS DRAWER
    // ─────────────────────────────────────────────
    let settingsOpen = false;
    let currentSettings = loadSettings();

    function openSettings() {
        settingsOpen = true;
        currentSettings = loadSettings();
        renderSettingsPanel();
        document.getElementById('settings-overlay').classList.add('open');
        document.getElementById('settings-drawer').classList.add('open');
        document.getElementById('btn-settings-toggle').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeSettings() {
        settingsOpen = false;
        document.getElementById('settings-overlay').classList.remove('open');
        document.getElementById('settings-drawer').classList.remove('open');
        document.getElementById('btn-settings-toggle').classList.remove('open');
        document.body.style.overflow = '';
    }

    function applyAndClose() {
        saveSettings(currentSettings);
        closeSettings();
        fetchAll();
    }

    function renderSettingsPanel() {
        const list = document.getElementById('settings-sources-list');
        const allSources = [...DEFAULT_SOURCES, ...currentSettings.custom];

        // Group by category
        const cats = {};
        allSources.forEach(s => {
            if (!cats[s.category]) cats[s.category] = [];
            cats[s.category].push(s);
        });

        const catOrder = ['national', 'business', 'tech', 'world', 'kids', 'custom'];
        const catLabels = { national: 'National', business: 'Business', tech: 'Technology', world: 'International', kids: '🧒 Kids', custom: 'Custom' };

        list.innerHTML = catOrder.filter(c => cats[c]).map(cat => `
            <div class="settings-category">
                <div class="settings-category-name">${catLabels[cat] || cat}</div>
                ${cats[cat].map(src => sourceRowHTML(src)).join('')}
            </div>
        `).join('');
    }

    function sourceRowHTML(src) {
        const enabled = !currentSettings.disabled.includes(src.id);
        const isCustom = !src.builtin;
        return `
        <div class="source-row${isCustom ? ' custom-row' : ''}" id="row-${src.id}">
            <div class="source-info">
                <span class="source-name">${src.name}</span>
                <span class="source-url">${src.url}</span>
            </div>
            <div class="source-row-actions">
                ${isCustom ? `<button class="btn-del-source" onclick="deleteCustomSource('${src.id}')" title="Remove">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>` : ''}
                <label class="toggle" title="${enabled ? 'Enabled' : 'Disabled'}">
                    <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSource('${src.id}', this.checked)">
                    <div class="toggle-track"></div>
                    <div class="toggle-knob"></div>
                </label>
            </div>
        </div>`;
    }

    function toggleSource(id, enabled) {
        if (enabled) {
            currentSettings.disabled = currentSettings.disabled.filter(x => x !== id);
        } else {
            if (!currentSettings.disabled.includes(id)) currentSettings.disabled.push(id);
        }
        // auto-save on toggle
        saveSettings(currentSettings);
    }

    function deleteCustomSource(id) {
        currentSettings.custom = currentSettings.custom.filter(s => s.id !== id);
        currentSettings.disabled = currentSettings.disabled.filter(x => x !== id);
        saveSettings(currentSettings);
        renderSettingsPanel();
    }

    function addCustomFeed() {
        const name = document.getElementById('input-feed-name').value.trim();
        const url  = document.getElementById('input-feed-url').value.trim();
        const cat  = document.getElementById('input-feed-category').value;
        const msg  = document.getElementById('form-msg');

        msg.className = 'form-msg';

        if (!name) { showMsg('error', 'Please enter a display name.'); return; }
        if (!url || !url.startsWith('http')) { showMsg('error', 'Please enter a valid feed URL.'); return; }

        const id = 'custom-' + Date.now();
        const newFeed = { id, name, category: cat, url, builtin: false };
        currentSettings.custom.push(newFeed);
        saveSettings(currentSettings);
        renderSettingsPanel();

        document.getElementById('input-feed-name').value = '';
        document.getElementById('input-feed-url').value  = '';
        showMsg('success', `"${name}" added successfully.`);
    }

    function showMsg(type, text) {
        const msg = document.getElementById('form-msg');
        msg.textContent = text;
        msg.className = 'form-msg ' + type;
        setTimeout(() => { msg.className = 'form-msg'; }, 3500);
    }

    // ─────────────────────────────────────────────
    //  NEWS FETCHING
    // ─────────────────────────────────────────────
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function fetchRSS(feed) {
        const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
        try {
            const res  = await fetch(proxyUrl);
            if (res.status === 429) {
                console.warn(`Rate limited (${feed.name}), retrying after 1s…`);
                await delay(1000);
                const retry = await fetch(proxyUrl);
                const data  = await retry.json();
                return (data.items || []).map(item => ({ ...item, source: feed.name }));
            }
            const data = await res.json();
            return (data.items || []).map(item => ({ ...item, source: feed.name }));
        } catch (err) {
            console.error(`Feed error (${feed.name}):`, err);
            return [];
        }
    }

    // Fetch feeds sequentially with a small gap to avoid proxy rate-limits
    async function fetchAllFeeds(feeds) {
        const results = [];
        for (const feed of feeds) {
            results.push(await fetchRSS(feed));
            await delay(300);
        }
        return results;
    }

    function setActiveBtn(cat) {
        document.querySelectorAll('#nav button:not(.btn-refresh)').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + cat);
        if (btn) btn.classList.add('active');
        document.getElementById('nav').classList.remove('open');
    }

    async function switchCategory(cat) {
        setActiveBtn(cat);
        loader.style.display = 'flex';
        container.innerHTML = '';
        const settings = loadSettings();
        const active = getActiveSources(settings).filter(s => s.category === cat);
        if (!active.length) {
            loader.style.display = 'none';
            container.innerHTML = `<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;padding:4rem 0;">
                No sources enabled for this category. Open Settings (⚙) to add some.
            </p>`;
            return;
        }
        const stories = await fetchAllFeeds(active);
        window.lastFetchedStories = stories.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        renderNews(window.lastFetchedStories);
    }

    async function fetchAll() {
        document.getElementById('nav').classList.remove('open');
        document.querySelectorAll('#nav button:not(.btn-refresh)').forEach(b => b.classList.remove('active'));
        loader.style.display = 'flex';
        container.innerHTML = '';
        const settings = loadSettings();
        const active = getActiveSources(settings);
        if (!active.length) {
            loader.style.display = 'none';
            container.innerHTML = `<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;padding:4rem 0;">
                No sources enabled. Open Settings (⚙) to enable some.
            </p>`;
            return;
        }
        const stories = await fetchAllFeeds(active);
        window.lastFetchedStories = stories.flat().sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        renderNews(window.lastFetchedStories);
    }

    function formatDate(str) {
        const d = new Date(str);
        if (isNaN(d)) return { date: '', time: '' };
        const date = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        const time = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
        return { date, time };
    }

    function renderNews(stories) {
        loader.style.display = 'none';
        if (!stories.length) {
            container.innerHTML = `<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;padding:4rem 0;">No stories found. Check your connection.</p>`;
            return;
        }

        container.innerHTML = stories.map((post, i) => {
            const delay = Math.min(i * 30, 300);
            const pubDateFormatted = formatDate(post.pubDate);
            
            const imgSrc = post.thumbnail || post.enclosure?.link;
            const desc = (post.description || '').replace(/<[^>]*>?/gm, '').trim();

            const imgHtml = imgSrc
                ? `<div class="card-img-wrap"><img src="${imgSrc}" alt="" loading="lazy" onerror="this.parentElement.outerHTML=noImgHtml()"></div>`
                : `<div class="card-no-img">${noImgSvg()}</div>`;

            return `
            <div class="card" style="animation-delay:${delay}ms">
                ${imgHtml}
                <div class="card-body">
                    <h2 class="card-title">${post.title}</h2>
                    ${desc ? `<p class="card-desc">${desc}</p>` : ''}
                    <div class="card-footer">
                        <div class="card-footer-meta">
                            <span class="card-source">${post.source}</span>
                            <span class="card-date">
                                <span class="card-date-day">${pubDateFormatted.date}</span>
                                <span class="card-date-time">
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${pubDateFormatted.time}
                                </span>
                            </span>
                        </div>
                        <a href="${post.link}" target="_blank" rel="noopener" class="card-link">Read more <span>→</span></a>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function noImgSvg() {
        return `<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
    }

    function noImgHtml() {
        return `<div class="card-no-img">${noImgSvg()}</div>`;
    }

    function noListImgSvg() {
        return `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
    }

    function noListImgHtml() {
        return `<div class="list-no-img">${noListImgSvg()}</div>`;
    }

    // Keyboard: Escape closes drawer
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && settingsOpen) closeSettings(); });

    // Initial load
    switchCategory('national');
    </script>
