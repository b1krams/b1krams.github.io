    <script>
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile } = window.FFmpegUtil;

        let ffmpeg = null;
        let wavesurfer = null;
        let wsRegions = null;
        let isFfmpegLoaded = false;
        
        let tracks = [];
        let selectedTrackId = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const controlsPanel = document.getElementById('controlsPanel');
        const trackListPanel = document.getElementById('trackListPanel');
        const trackListEl = document.getElementById('trackList');
        const resetBtn = document.getElementById('resetBtn');
        const addTrackBtn = document.getElementById('addTrackBtn');
        const addTrackBtnHeader = document.getElementById('addTrackBtnHeader');
        const startTimeInput = document.getElementById('startTime');
        const endTimeInput = document.getElementById('endTime');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const timeDisplay = document.getElementById('timeDisplay');
        const logOutput = document.getElementById('logOutput');
        const exportProgress = document.getElementById('exportProgress');
        const currentTrackName = document.getElementById('currentTrackName');
        const transitionTypeEl = document.getElementById('transitionType');
        const transitionDurationEl = document.getElementById('transitionDuration');
        const trackVolumeInput = document.getElementById('trackVolume');
        const volumeDisplay = document.getElementById('volumeDisplay');
        const fadeInInput = document.getElementById('trackFadeIn');
        const fadeOutInput = document.getElementById('trackFadeOut');
        const zoomSlider = document.getElementById('zoomSlider');
        const playbackSpeed = document.getElementById('playbackSpeed');
        const playRegionBtn = document.getElementById('playRegionBtn');
        
        // Initialize FFmpeg
        async function initFFmpeg() {
            if (isFfmpegLoaded) return;
            ffmpeg = new FFmpeg();
            
            ffmpeg.on('log', ({ message }) => {
                const div = document.createElement('div');
                div.textContent = message;
                logOutput.appendChild(div);
                logOutput.scrollTop = logOutput.scrollHeight;
            });

            ffmpeg.on('progress', ({ progress, time }) => {
                exportProgress.style.width = `${Math.max(0, Math.min(100, progress * 100))}%`;
            });

            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                classWorkerURL: await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript'),
            });
            isFfmpegLoaded = true;
        }

        async function toBlobURL(url, mimeType) {
            const resp = await fetch(url);
            const blob = await resp.blob();
            return URL.createObjectURL(new Blob([blob], { type: mimeType }));
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Event Listeners for file adding
        dropZone.addEventListener('click', () => fileInput.click());
        addTrackBtn.addEventListener('click', () => fileInput.click());
        addTrackBtnHeader.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFiles(Array.from(e.dataTransfer.files));
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFiles(Array.from(e.target.files));
            }
        });
        
        function handleFiles(files) {
            const audioFiles = files.filter(f => f.type.startsWith('audio/') || f.type.startsWith('video/'));
            if(audioFiles.length === 0) return;

            audioFiles.forEach(file => {
                tracks.push({
                    id: generateId(),
                    file: file,
                    name: file.name,
                    trimStart: 0,
                    trimEnd: 0, 
                    duration: 0,
                    volume: 1.0,
                    fadeIn: 0.0,
                    fadeOut: 0.0,
                    url: URL.createObjectURL(file)
                });
            });

            // UI Reveal
            dropZone.classList.add('hidden');
            workspace.classList.remove('hidden');
            trackListPanel.classList.remove('hidden');
            controlsPanel.classList.remove('opacity-50', 'pointer-events-none');
            resetBtn.classList.remove('hidden');
            addTrackBtnHeader.classList.remove('hidden');

            renderTrackList();
            
            // If no track selected, select the first new one
            if (!selectedTrackId) {
                selectTrack(tracks[tracks.length - audioFiles.length].id);
            }

            // Start loading FFmpeg
            initFFmpeg().catch(err => {
                console.error("FFmpeg load failed", err);
                alert("Failed to load FFmpeg engine.");
            });
        }
        
        function renderTrackList() {
            trackListEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const el = document.createElement('div');
                const isSelected = track.id === selectedTrackId;
                el.className = `flex justify-between items-center p-2 rounded-lg cursor-pointer transition select-none ${isSelected ? 'bg-indigo-900/50 border border-indigo-500' : 'bg-slate-800 hover:bg-slate-700 border border-transparent'}`;
                
                el.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <div class="drag-handle text-slate-500 hover:text-slate-350 cursor-grab active:cursor-grabbing p-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                        </div>
                        <div class="truncate flex-1">
                            <div class="text-xs font-semibold text-slate-200 truncate">${index + 1}. ${track.name}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">
                                ${formatSize(track.file.size)} • ${track.duration ? formatTime(track.duration) : 'Loading...'}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-0.5 ml-2">
                        <button title="Move Up" class="p-1 text-slate-500 hover:text-slate-300 rounded transition ${index === 0 ? 'opacity-30 pointer-events-none' : ''}" onclick="moveTrack('${track.id}', -1, event)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                        </button>
                        <button title="Move Down" class="p-1 text-slate-500 hover:text-slate-300 rounded transition ${index === tracks.length - 1 ? 'opacity-30 pointer-events-none' : ''}" onclick="moveTrack('${track.id}', 1, event)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <button class="text-slate-500 hover:text-red-400 p-1 transition" onclick="removeTrack('${track.id}', event)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `;
                
                el.onclick = () => selectTrack(track.id);
                
                // Drag & Drop event listeners
                el.setAttribute('draggable', 'true');
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                    el.classList.add('opacity-40');
                });
                el.addEventListener('dragend', () => {
                    el.classList.remove('opacity-40');
                });
                el.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                el.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIndex = index;
                    if (fromIndex !== toIndex && !isNaN(fromIndex)) {
                        const item = tracks.splice(fromIndex, 1)[0];
                        tracks.splice(toIndex, 0, item);
                        renderTrackList();
                        if (typeof renderMixTimeline === 'function') {
                            renderMixTimeline();
                        }
                    }
                });
                
                trackListEl.appendChild(el);
            });
            
            if (tracks.length === 0) {
                resetWorkspace();
            }
        }
        
        window.moveTrack = function(id, direction, e) {
            e.stopPropagation();
            const index = tracks.findIndex(t => t.id === id);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= tracks.length) return;
            
            const temp = tracks[index];
            tracks[index] = tracks[newIndex];
            tracks[newIndex] = temp;
            
            renderTrackList();
            if (typeof renderMixTimeline === 'function') {
                renderMixTimeline();
            }
        }
        
        window.removeTrack = function(id, e) {
            e.stopPropagation();
            tracks = tracks.filter(t => t.id !== id);
            if (selectedTrackId === id) {
                if (tracks.length > 0) selectTrack(tracks[0].id);
                else selectedTrackId = null;
            }
            renderTrackList();
            if (typeof renderMixTimeline === 'function') {
                renderMixTimeline();
            }
        }

        function selectTrack(id) {
            selectedTrackId = id;
            renderTrackList();
            const track = tracks.find(t => t.id === id);
            if(track) {
                currentTrackName.innerText = `Editing: ${track.name}`;
                loadAudioToWavesurfer(track);
                
                // Sync new controls
                if (trackVolumeInput) {
                    trackVolumeInput.value = track.volume;
                    if (volumeDisplay) {
                        volumeDisplay.innerText = Math.round(track.volume * 100) + '%';
                    }
                }
                if (fadeInInput) fadeInInput.value = track.fadeIn || 0;
                if (fadeOutInput) fadeOutInput.value = track.fadeOut || 0;
            }
        }

        // Wavesurfer setup
        function initWavesurfer() {
            if (wavesurfer) {
                wavesurfer.destroy();
            }

            const ctx = document.createElement('canvas').getContext('2d');
            const waveGrad = ctx.createLinearGradient(0, 0, 0, 96);
            waveGrad.addColorStop(0, '#818cf8'); // Indigo 400
            waveGrad.addColorStop(0.5, '#6366f1'); // Indigo 500
            waveGrad.addColorStop(1, '#312e81'); // Indigo 900
            
            const progressGrad = ctx.createLinearGradient(0, 0, 0, 96);
            progressGrad.addColorStop(0, '#c7d2fe'); // Indigo 200
            progressGrad.addColorStop(0.5, '#a5b4fc'); // Indigo 300
            progressGrad.addColorStop(1, '#4f46e5'); // Indigo 600

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: waveGrad,
                progressColor: progressGrad,
                cursorColor: '#f8fafc',
                barWidth: 2,
                barGap: 1,
                barRadius: 2,
                height: 96,
                normalize: true,
            });

            wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());

            wavesurfer.on('decode', (duration) => {
                const track = tracks.find(t => t.id === selectedTrackId);
                if (track) {
                    track.duration = duration;
                    if (track.trimEnd === 0 || track.trimEnd > duration) {
                        track.trimEnd = duration;
                    }
                    
                    startTimeInput.value = track.trimStart.toFixed(2);
                    endTimeInput.value = track.trimEnd.toFixed(2);
                    
                    wsRegions.clearRegions();
                    wsRegions.addRegion({
                        start: track.trimStart,
                        end: track.trimEnd,
                        color: 'rgba(99, 102, 241, 0.18)',
                        drag: true,
                        resize: true,
                    });

                    // Apply zoom and speed settings
                    if (zoomSlider) {
                        wavesurfer.zoom(Number(zoomSlider.value));
                    }
                    if (playbackSpeed) {
                        wavesurfer.setPlaybackRate(parseFloat(playbackSpeed.value));
                    }
                    
                    if (typeof renderMixTimeline === 'function') {
                        renderMixTimeline();
                    }
                    // Re-render track list to update duration text if it was loading
                    renderTrackList();
                }
            });
            
            wavesurfer.on('timeupdate', (currentTime) => {
                const total = wavesurfer.getDuration() || 0;
                timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(total)}`;
            });

            wavesurfer.on('play', () => {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            });

            wavesurfer.on('pause', () => {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            });

            wsRegions.on('region-updated', (region) => {
                const track = tracks.find(t => t.id === selectedTrackId);
                if(track) {
                    track.trimStart = region.start;
                    track.trimEnd = region.end;
                    startTimeInput.value = region.start.toFixed(2);
                    endTimeInput.value = region.end.toFixed(2);
                    if (typeof renderMixTimeline === 'function') {
                        renderMixTimeline();
                    }
                }
            });
        }

        function loadAudioToWavesurfer(track) {
            if (!wavesurfer) initWavesurfer();
            wavesurfer.load(track.url);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 10);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
        }

        playBtn.addEventListener('click', () => {
            if (!wavesurfer) return;
            if (wavesurfer.isPlaying()) {
                wavesurfer.pause();
            } else {
                const regions = wsRegions.getRegions();
                if (regions.length > 0) {
                    const currentTime = wavesurfer.getCurrentTime();
                    const r = regions[0];
                    if (currentTime < r.start || currentTime >= r.end) {
                        r.play();
                    } else {
                        wavesurfer.play();
                    }
                } else {
                    wavesurfer.play();
                }
            }
        });

        playRegionBtn.addEventListener('click', () => {
            if (!wavesurfer) return;
            const regions = wsRegions.getRegions();
            if (regions.length > 0) {
                regions[0].play();
            } else {
                wavesurfer.play();
            }
        });

        zoomSlider.addEventListener('input', () => {
            if (wavesurfer) {
                wavesurfer.zoom(Number(zoomSlider.value));
            }
        });

        playbackSpeed.addEventListener('change', () => {
            if (wavesurfer) {
                wavesurfer.setPlaybackRate(parseFloat(playbackSpeed.value));
            }
        });

        [startTimeInput, endTimeInput].forEach(el => {
            el.addEventListener('change', () => {
                const track = tracks.find(t => t.id === selectedTrackId);
                if(!track) return;
                
                track.trimStart = parseFloat(startTimeInput.value) || 0;
                track.trimEnd = parseFloat(endTimeInput.value) || 0;
                
                const regions = wsRegions.getRegions();
                if (regions.length > 0) {
                    regions[0].setOptions({
                        start: track.trimStart,
                        end: track.trimEnd
                    });
                }
                if (typeof renderMixTimeline === 'function') {
                    renderMixTimeline();
                }
            });
        });

        trackVolumeInput.addEventListener('input', () => {
            const track = tracks.find(t => t.id === selectedTrackId);
            if(!track) return;
            track.volume = parseFloat(trackVolumeInput.value);
            volumeDisplay.innerText = Math.round(track.volume * 100) + '%';
        });

        [fadeInInput, fadeOutInput].forEach(el => {
            el.addEventListener('change', () => {
                const track = tracks.find(t => t.id === selectedTrackId);
                if(!track) return;
                track.fadeIn = parseFloat(fadeInInput.value) || 0;
                track.fadeOut = parseFloat(fadeOutInput.value) || 0;
                if (typeof renderMixTimeline === 'function') {
                    renderMixTimeline();
                }
            });
        });

        resetBtn.addEventListener('click', () => {
            resetWorkspace();
        });
        
        function resetWorkspace() {
            if (wavesurfer) wavesurfer.destroy();
            wavesurfer = null;
            tracks = [];
            selectedTrackId = null;
            fileInput.value = '';
            
            dropZone.classList.remove('hidden');
            workspace.classList.add('hidden');
            trackListPanel.classList.add('hidden');
            controlsPanel.classList.add('opacity-50', 'pointer-events-none');
            resetBtn.classList.add('hidden');
            addTrackBtnHeader.classList.add('hidden');
            const mixTimelineEl = document.getElementById('mixTimeline');
            if (mixTimelineEl) {
                mixTimelineEl.innerHTML = '<p class="text-[10px] text-slate-500 text-center py-2">Add tracks to visualize layout.</p>';
            }
            logOutput.classList.add('hidden');
            exportProgress.style.width = '0%';
        }

        function renderMixTimeline() {
            const mixTimelineEl = document.getElementById('mixTimeline');
            if (!mixTimelineEl) return;
            
            if (tracks.length === 0) {
                mixTimelineEl.innerHTML = '<p class="text-[10px] text-slate-500 text-center py-2">Add tracks to visualize layout.</p>';
                return;
            }
            
            mixTimelineEl.innerHTML = '';
            
            const tType = transitionTypeEl.value;
            const tDur = parseFloat(transitionDurationEl.value) || 0;
            
            tracks.forEach((track, index) => {
                const trackItem = document.createElement('div');
                const duration = track.duration ? (track.trimEnd - track.trimStart) : 0;
                
                trackItem.className = `p-2 rounded border text-xs flex justify-between items-center transition-colors cursor-pointer select-none ${
                    track.id === selectedTrackId 
                        ? 'bg-indigo-950/70 border-indigo-500 text-indigo-200 shadow-sm shadow-indigo-500/20' 
                        : 'bg-slate-800/80 border-slate-700 text-slate-350 hover:bg-slate-750'
                }`;
                
                trackItem.innerHTML = `
                    <div class="truncate flex-1 font-medium">
                        <span class="opacity-60 text-[10px] font-mono mr-1">#${index + 1}</span> ${track.name}
                    </div>
                    <div class="text-[10px] opacity-75 font-mono ml-2 flex gap-1 items-center">
                        <span class="bg-slate-900 border border-slate-700 rounded px-1 text-[9px] text-slate-300 font-sans">${duration > 0 ? duration.toFixed(1) + 's' : '0s'}</span>
                        ${track.volume !== 1.0 ? `<span class="bg-indigo-900/60 border border-indigo-700 rounded px-1 text-[9px] text-indigo-300 font-sans">Vol: ${Math.round(track.volume * 100)}%</span>` : ''}
                        ${track.fadeIn > 0 ? `<span class="bg-emerald-950 border border-emerald-800 text-emerald-300 rounded px-1 text-[9px] font-sans">↗ ${track.fadeIn}s</span>` : ''}
                        ${track.fadeOut > 0 ? `<span class="bg-rose-950 border border-rose-800 text-rose-300 rounded px-1 text-[9px] font-sans">↘ ${track.fadeOut}s</span>` : ''}
                    </div>
                `;
                
                trackItem.onclick = () => selectTrack(track.id);
                mixTimelineEl.appendChild(trackItem);
                
                if (index < tracks.length - 1) {
                    const transItem = document.createElement('div');
                    transItem.className = 'text-[9px] font-mono text-center py-1 bg-slate-950/60 rounded border border-dashed border-slate-850 text-slate-500 flex justify-center items-center gap-1.5 select-none';
                    
                    if (tType === 'none') {
                        transItem.innerHTML = `
                            <svg class="w-3 h-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                            <span>Seamless Connection</span>
                        `;
                    } else if (tType === 'gap') {
                        transItem.innerHTML = `
                            <svg class="w-3 h-3 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span>Silence Gap: <b class="text-slate-400 font-sans">${tDur.toFixed(1)}s</b></span>
                        `;
                    } else if (tType === 'crossfade') {
                        transItem.innerHTML = `
                            <svg class="w-3 h-3 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                            <span>Crossfade: <b class="text-slate-400 font-sans">${tDur.toFixed(1)}s</b></span>
                        `;
                    }
                    
                    mixTimelineEl.appendChild(transItem);
                }
            });
        }

        [transitionTypeEl, transitionDurationEl].forEach(el => {
            el.addEventListener('change', () => {
                renderMixTimeline();
            });
        });

        // Logs Toggle and Clear Bindings
        const toggleLogsBtn = document.getElementById('toggleLogsBtn');
        const logContainer = document.getElementById('logContainer');
        const logsChevron = document.getElementById('logsChevron');
        const clearLogsBtn = document.getElementById('clearLogsBtn');

        toggleLogsBtn.addEventListener('click', () => {
            const isHidden = logContainer.classList.contains('hidden');
            if (isHidden) {
                logContainer.classList.remove('hidden');
                logsChevron.classList.add('rotate-180');
            } else {
                logContainer.classList.add('hidden');
                logsChevron.classList.remove('rotate-180');
            }
        });

        clearLogsBtn.addEventListener('click', () => {
            logOutput.innerHTML = '';
        });
        
        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (tracks.length === 0 || !isFfmpegLoaded) {
                if(!isFfmpegLoaded) alert("Audio engine is still loading, please wait a moment...");
                return;
            }

            const btn = document.getElementById('exportBtn');
            const btnText = document.getElementById('exportBtnText');
            
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.innerText = "Processing...";
            
            const logContainer = document.getElementById('logContainer');
            const logsChevron = document.getElementById('logsChevron');
            if (logContainer) logContainer.classList.remove('hidden');
            if (logsChevron) logsChevron.classList.add('rotate-180');
            
            logOutput.innerHTML = '';
            exportProgress.style.width = '0%';

            try {
                const outFormat = document.getElementById('exportFormat').value;
                const outName = `output.${outFormat}`;
                const tType = transitionTypeEl.value;
                const tDur = parseFloat(transitionDurationEl.value) || 2.0;
                
                // Write all files to FFmpeg FS
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    const ext = track.file.name.split('.').pop();
                    const inName = `input_${i}.${ext}`;
                    await ffmpeg.writeFile(inName, await fetchFile(track.file));
                }

                // Build FFmpeg command and filter_complex
                let ffmpegArgs = [];
                let filterComplex = "";

                // Add inputs and base trimming, volume & fading
                for (let i = 0; i < tracks.length; i++) {
                    const track = tracks[i];
                    const ext = track.file.name.split('.').pop();
                    const inName = `input_${i}.${ext}`;
                    ffmpegArgs.push('-i', inName);
                    
                    // Base resampling, channel format and trim
                    let trackFilters = `[${i}:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo,atrim=${track.trimStart}:${track.trimEnd},asetpts=PTS-STARTPTS`;
                    
                    // Volume adjustment
                    if (track.volume !== undefined && track.volume !== 1.0) {
                        trackFilters += `,volume=${track.volume.toFixed(2)}`;
                    }
                    
                    // Fade In
                    if (track.fadeIn && track.fadeIn > 0) {
                        trackFilters += `,afade=t=in:st=0:d=${track.fadeIn.toFixed(2)}`;
                    }
                    
                    // Fade Out
                    if (track.fadeOut && track.fadeOut > 0) {
                        const trimmedDuration = track.trimEnd - track.trimStart;
                        const fadeOutStart = Math.max(0, trimmedDuration - track.fadeOut);
                        trackFilters += `,afade=t=out:st=${fadeOutStart.toFixed(2)}:d=${track.fadeOut.toFixed(2)}`;
                    }
                    
                    filterComplex += `${trackFilters}[a${i}];`;
                }

                // Concatenation Logic based on Transition Type
                if (tracks.length === 1) {
                    // Only one track, just use its output directly
                    filterComplex += `[a0]anull[outa]`;
                } else if (tType === 'none') {
                    // Seamless concat
                    let concatInputs = "";
                    for (let i = 0; i < tracks.length; i++) {
                        concatInputs += `[a${i}]`;
                    }
                    filterComplex += `${concatInputs}concat=n=${tracks.length}:v=0:a=1[outa]`;
                } else if (tType === 'gap') {
                    // Gap (Silence) between tracks
                    let concatInputs = "";
                    let nSegments = tracks.length * 2 - 1;
                    for (let i = 0; i < tracks.length; i++) {
                        concatInputs += `[a${i}]`;
                        if (i < tracks.length - 1) {
                            filterComplex += `anullsrc=d=${tDur}:r=44100:cl=stereo[silence${i}];`;
                            concatInputs += `[silence${i}]`;
                        }
                    }
                    filterComplex += `${concatInputs}concat=n=${nSegments}:v=0:a=1[outa]`;
                } else if (tType === 'crossfade') {
                    // Crossfade
                    if (tracks.length === 2) {
                        filterComplex += `[a0][a1]acrossfade=d=${tDur}:c1=tri:c2=tri[outa]`;
                    } else {
                        let prevOut = '[a0]';
                        for (let i = 1; i < tracks.length; i++) {
                            const currentIn = `[a${i}]`;
                            const currentOut = i === tracks.length - 1 ? '[outa]' : `[cf${i}]`;
                            filterComplex += `${prevOut}${currentIn}acrossfade=d=${tDur}:c1=tri:c2=tri${currentOut};`;
                            prevOut = currentOut;
                        }
                    }
                }
                
                // Clean up any trailing semicolons just in case
                filterComplex = filterComplex.replace(/;$/, '');

                ffmpegArgs.push('-filter_complex', filterComplex);
                ffmpegArgs.push('-map', '[outa]');
                
                // Encoder options
                const encoder = (outFormat === 'mp3' ? 'libmp3lame' : (outFormat === 'ogg' ? 'libvorbis' : (outFormat === 'aac' ? 'aac' : 'pcm_s16le')));
                ffmpegArgs.push('-c:a', encoder);
                
                if(outFormat === 'mp3') ffmpegArgs.push('-q:a', '2'); // VBR quality

                ffmpegArgs.push(outName);

                // Run ffmpeg command
                await ffmpeg.exec(ffmpegArgs);

                const data = await ffmpeg.readFile(outName);
                
                // Create download link
                const blob = new Blob([data.buffer], { type: `audio/${outFormat}` });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mixed_audio.${outFormat}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                btnText.innerText = "Done! Downloading...";
                setTimeout(() => {
                    btnText.innerText = "Process & Download";
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    exportProgress.style.width = '0%';
                }, 3000);

            } catch (err) {
                console.error(err);
                alert("Error processing audio: " + err.message);
                btnText.innerText = "Error. Try Again";
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
